; MIY004 firmware - STM32L452CEU6, STM32Cube HAL
;
;   pio run                     build the product firmware
;   pio run -t upload           flash over ST-LINK (SWD)
;   pio test -e native          host-side unit tests (no hardware)

[platformio]
default_envs = miy004
boards_dir = boards

[stm32]
platform = ststm32
board = miy004_l452ceu6
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -Wall
    -Wextra

[env:miy004]
extends = stm32

[env:miy004_debug]
extends = stm32
build_type = debug
build_flags =
    ${stm32.build_flags}
    -DMIY_DEBUG

; Pure logic only (volume envelope, rate maths). Hardware libraries are ignored.
[env:native]
platform = native
build_flags = -std=c11 -Wall -Wextra
test_build_src = no
lib_ignore =
    miy004_board
    miy004_flash
    miy004_audio
    miy004_hall
